<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" aria-labelledby="t" role="img" viewBox="0 0 1040 700"><title id="t">换装验收台的四个包：单向依赖，判定在 capability 层</title><style>.bg{fill:#ede9e1}.box{fill:#f7f4ee;stroke:#bab5a9;stroke-width:1}.box-hi{fill:#fdfbf6;stroke:#1b2a33;stroke-width:1.4}.ttl{font:600 15px &quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,system-ui,sans-serif;fill:#1b2a33}.sub{font:12px &quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,system-ui,sans-serif;fill:#566670}.num{font:600 13px ui-monospace,&quot;Cascadia Mono&quot;,Consolas,monospace;fill:#1b2a33}.lbl{font:11.5px &quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,system-ui,sans-serif;fill:#566670}.arrow{stroke:#8a8579;stroke-width:1.2;fill:none}.h,.k{font:600 16px &quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,system-ui,sans-serif;fill:#1b2a33}.k{font:600 12.5px ui-monospace,&quot;Cascadia Mono&quot;,Consolas,monospace}.v{font:12px ui-monospace,&quot;Cascadia Mono&quot;,Consolas,monospace;fill:#566670}.ok{fill:#3f6b57}.rule{stroke:#cbc6b9;stroke-width:1}</style><rect width="1040" height="700" x="0" y="0" class="bg"/><text x="40" y="46" class="h">换装验收台 · 依赖只能往下走</text><text x="40" y="68" class="lbl">tools/check.py 里有一条检查专门盯这件事：上层能 import 下层，反过来报错。</text><g><rect width="520" height="74" x="40" y="94" class="box" rx="6"/><text x="62" y="122" class="ttl">web/</text><text x="62" y="143" class="sub">原生 ES 模块 + 六份 CSS，无框架、无构建；轮询 /api/job 拿进度</text><rect width="520" height="74" x="40" y="182" class="box" rx="6"/><text x="62" y="210" class="ttl">api/</text><text x="472" y="122" class="num" text-anchor="end">1797 行</text><text x="62" y="231" class="sub">骨架只负责分发和写字节，业务在 routes/ 的五个文件里</text><rect width="520" height="74" x="40" y="270" class="box" rx="6"/><text x="62" y="298" class="ttl">pipeline/</text><text x="472" y="210" class="num" text-anchor="end">699 行</text><text x="62" y="319" class="sub">要不要继续、走哪种打法、最后挑哪张，都是纯函数；runner 只管 IO</text><rect width="520" height="98" x="40" y="358" class="box-hi" rx="6"/><text x="62" y="386" class="ttl">capability/</text><text x="472" y="298" class="num" text-anchor="end">263 行</text><text x="62" y="407" class="sub">生成 · 判定 · 参考图整理，每块都能脱离流水线单独调</text><text x="62" y="428" class="v">generate/ graph · comfyui · cloud judge/ faces · hands · rules</text><text x="62" y="446" class="v">prep/ crop · parse_clothes</text><rect width="520" height="74" x="40" y="470" class="box" rx="6"/><text x="62" y="498" class="ttl">core/</text><text x="472" y="386" class="num" text-anchor="end">1322 行</text><text x="62" y="519" class="sub">检查定义 · 配置默认值 · 路径 · JSONL 存证 · Job 的数据形状</text><text x="472" y="498" class="num" text-anchor="end">395 行</text></g><g class="arrow"><path d="M 592 131 L 592 219"/><path d="M 588 213 L 592 219 L 596 213"/><path d="M 592 219 L 592 307"/><path d="M 588 301 L 592 307 L 596 301"/><path d="M 592 307 L 592 395"/><path d="M 588 389 L 592 395 L 596 389"/><path d="M 592 395 L 592 483"/><path d="M 588 477 L 592 483 L 596 477"/></g><text x="600" y="300" class="lbl">只能往下 import</text><rect width="300" height="450" x="700" y="94" class="box" rx="6"/><text x="722" y="126" class="h">五项判定</text><text x="722" y="148" class="lbl">判不了的（文字水印）不列，列了就是一排“—”</text><g><text x="722" y="184" class="k">脸没变</text><text x="978" y="184" class="v" text-anchor="end">余弦 ≥ 0.45</text><line x1="722" x2="978" y1="198" y2="198" class="rule"/><text x="722" y="222" class="k">衣服换上了</text><text x="978" y="222" class="v" text-anchor="end">身体区域 ≥ 20%</text><line x1="722" x2="978" y1="236" y2="236" class="rule"/><text x="722" y="260" class="k">手还在</text><text x="978" y="260" class="v" text-anchor="end">手数与原图一致</text><line x1="722" x2="978" y1="274" y2="274" class="rule"/><text x="722" y="298" class="k">背景没动</text><text x="978" y="298" class="v" text-anchor="end">主色距离 ≤ 30</text><line x1="722" x2="978" y1="312" y2="312" class="rule"/><text x="722" y="336" class="k">没有多余的人</text><text x="978" y="336" class="v" text-anchor="end">人脸数 ≤ 原图</text></g><text x="722" y="376" class="lbl">前两项和后两项里，脸·衣服·手是关键项：</text><text x="722" y="394" class="lbl">只有关键项不过才重试。</text><text x="722" y="424" class="lbl">整套判定 0.4–0.7 秒，跑在 CPU 上，</text><text x="722" y="442" class="lbl">不占生成用的显存。</text><text x="722" y="480" class="ok k">八组合格 6/8 · 首轮 5/8</text><text x="722" y="500" class="v">手是唯一没过满的那项（75%）</text><rect width="960" height="98" x="40" y="568" class="box" rx="6"/><text x="62" y="598" class="ttl">一次任务怎么走</text><text x="62" y="622" class="v">整理参考图 → 生成（ComfyUI，约 56 秒）→ 五项判定 → 通过就采纳</text><text x="62" y="644" class="v">不通过且是关键项 → 把失败项翻成追加约束重跑（最多 2 次）→ 还不过：指令退回原文、cfg 抬到 2.0</text><text x="978" y="598" class="v" text-anchor="end">三次都不过也不假装成功，</text><text x="978" y="616" class="v" text-anchor="end">从所有尝试里挑分数最高的那张</text></svg>